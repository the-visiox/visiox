version: '3.9'

# App services — each developer runs this locally
#
#   cp env.example .env   # fill in shared server IPs
#   docker compose up
#
# Requires the shared infrastructure (docker-compose.infra.yml) to be running
# on the shared server before starting these services.

services:
  api:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  worker:
    build: .
    restart: unless-stopped
    command: celery -A visiox worker -l info -Q celery,datasets
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TRAINING_AGENT_URL: ${TRAINING_AGENT_URL:-http://host.docker.internal:8002}

  beat:
    build: .
    restart: unless-stopped
    command: celery -A visiox beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
