version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: visiox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-visiox_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-cvat.sql:/docker-entrypoint-initdb.d/init-cvat.sql:ro
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    networks:
      - default
      - shared_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-visiox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.11-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CVAT_HOST: http://cvat_server:8080
      CVAT_PUBLIC_URL: ${CVAT_PUBLIC_URL:-http://localhost:8080}
      CVAT_WEBHOOK_URL: ${CVAT_WEBHOOK_URL:-http://visiox-api-1:8000/api/datasets/cvat-webhook/}
    networks:
      - default
      - shared_db
      - cvat_cvat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: celery -A visiox worker -l info
    volumes:
      - .:/app
      - media_files:/app/media
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CVAT_HOST: http://cvat_server:8080
      CVAT_PUBLIC_URL: ${CVAT_PUBLIC_URL:-http://localhost:8080}
      CVAT_WEBHOOK_URL: ${CVAT_WEBHOOK_URL:-http://visiox-api-1:8000/api/datasets/cvat-webhook/}
    networks:
      - default
      - shared_db
      - cvat_cvat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: celery -A visiox beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:

networks:
  shared_db:
    external: true
  cvat_cvat:
    external: true
    name: cvat_cvat
